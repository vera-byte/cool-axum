server:
  address: ":8001"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  clientMaxBodySize: 104857600

logger:
  level: "info"      # trace/debug/info/warn/error
  format: "text"     # text | json
  stdout: true
  # file:            # 可选：文件输出（按大小轮转）
  #   path: "./logs/cool-axum.log"
  #   maxSize: 10485760
  #   maxFiles: 5

database:
  default:
    type: "mysql"
    host: "127.0.0.1"
    port: "3306"
    user: "root"
    pass: "123456"
    name: "cooltest"
    charset: "utf8mb4"
    timezone: "Asia/Shanghai"
    debug: true
    createdAt: "createTime"
    updatedAt: "updateTime"
    deletedAt: "deleteTime"

redis:
  cool:
    address: "127.0.0.1:6379"
    db: 0

cool:
  autoMigrate: true
  eps: true
  file:
    mode: "local"
    domain: "http://127.0.0.1:8001"
  # 多租户（可选，对齐 cool-admin-midway v8.0）
  tenant:
    enable: true
    urls:
      - "/admin/**"

modules:
  base:
    auth:
      sso: false
      secret: "cool-base88776655"
      tokenExpire: 36000
      refreshExpire: 1296000
    middleware:
      authority:
        enable: true
      log:
        enable: true

# Raft 集群（可选）：启用后 Leader 节点执行定时任务
# dataDir 自动按节点隔离为 dataDir/n{nodeId}，多节点可共用同一根目录
raft:
  enable: true
  nodeId: 1
  selfAddr: "http://127.0.0.1:8001"
  dataDir: "./data/raft"
  peers:
    - "1:http://127.0.0.1:8001"
    - "2:http://127.0.0.1:8002"
