[package]
name = "cool-axum"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "cool-admin-go 的 Rust / Axum 完整移植"

[[bin]]
name = "cool-axum"
path = "src/main.rs"

[workspace]
resolver = "2"
members = [
    "crates/cool-config",
    "crates/cool-db",
    "crates/cool-core",
    "crates/cool-auth",
    "crates/cool-cache",
    "crates/cool-file",
    "crates/cool-raft",
    "crates/cool-gen",
    "modules",
    "modules/base",
    "modules/dict",
    "modules/demo",
    "modules/task",
    "modules/space",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
cool-config = { path = "crates/cool-config" }
cool-db = { path = "crates/cool-db" }
cool-core = { path = "crates/cool-core" }
cool-auth = { path = "crates/cool-auth" }
cool-cache = { path = "crates/cool-cache" }
cool-file = { path = "crates/cool-file" }
cool-raft = { path = "crates/cool-raft" }
modules = { path = "modules" }
mod-base = { path = "modules/base" }
mod-dict = { path = "modules/dict" }
mod-demo = { path = "modules/demo" }
mod-task = { path = "modules/task" }
mod-space = { path = "modules/space" }

axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "postgres", "chrono", "uuid"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bcrypt = "0.16"
md5 = "0.7"
cron = "0.15"
base64 = "0.22"
openraft = { version = "0.10.0-alpha.37", features = ["serde"] }
openraft-memstore = "0.10.0-alpha.37"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 官方 sa-token-rust（git 依赖）
sa-token-plugin-axum = { git = "https://github.com/sa-tokens/sa-token-rust", package = "sa-token-plugin-axum", features = ["axum-08", "memory", "redis"] }
sa-token-storage-redis = { git = "https://github.com/sa-tokens/sa-token-rust", package = "sa-token-storage-redis" }
sa-token-storage-memory = { git = "https://github.com/sa-tokens/sa-token-rust", package = "sa-token-storage-memory" }

[dependencies]
cool-config = { workspace = true }
cool-db = { workspace = true }
cool-core = { workspace = true }
cool-auth = { workspace = true }
cool-cache = { workspace = true }
cool-file = { workspace = true }
cool-raft = { workspace = true }
mod-base = { workspace = true }
chrono = { workspace = true }
mod-dict = { workspace = true }
mod-demo = { workspace = true }
mod-task = { workspace = true }
mod-space = { workspace = true }
modules = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
