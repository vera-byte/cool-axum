[package]
name = "cool-core"
version.workspace = true
edition.workspace = true

[dependencies]
# ── 原 cool-core ──
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
redis = { workspace = true }
uuid = { workspace = true }
futures-util = "0.3"

# ── 原 cool-config ──
serde_yaml = { workspace = true }

# ── 原 cool-auth（sa-token） ──
sa-token-plugin-axum = { workspace = true }
sa-token-storage-redis = { workspace = true }
sa-token-storage-memory = { workspace = true }
bcrypt = { workspace = true }
md5 = { workspace = true }

# ── 原 cool-file ──
bytes = { version = "1", features = ["serde"] }
reqwest = { workspace = true }

# ── 原 cool-raft（openraft + RocksDB） ──
anyhow = { workspace = true }
openraft = { workspace = true }
openraft-memstore = { workspace = true }
futures = "0.3"
byteorder = "1.4"
rocksdb = { version = "0.22", default-features = false, features = ["snappy"] }
